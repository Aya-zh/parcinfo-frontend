<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="circuitPattern" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="#060D1F"/>

      <g stroke="#1A6BFF" stroke-width="1.2" stroke-linecap="round" opacity="0.1" fill="none">
        <!-- Horizontal traces -->
        <path d="M0 40 H50 V60 H90 H140 V30 H200"/>
        <path d="M0 100 H70 V130 H120 V90 H200"/>
        <path d="M20 170 H80 V150 H150 H200"/>

        <!-- Vertical traces -->
        <path d="M40 0 V50 H70 V90"/>
        <path d="M100 0 V40 H130 V80 H100 V140"/>
        <path d="M160 0 V60 H130 V120 H170 V200"/>

        <!-- Extra details -->
        <path d="M60 60 H90"/>
        <path d="M120 130 H160"/>
        <path d="M80 150 V180"/>
      </g>

      <!-- Nodes -->
      <g fill="#1A6BFF" opacity="0.12">
        <circle cx="50" cy="40" r="2"/>
        <circle cx="90" cy="60" r="2"/>
        <circle cx="140" cy="30" r="2"/>
        <circle cx="70" cy="100" r="2"/>
        <circle cx="120" cy="130" r="2"/>
        <circle cx="80" cy="170" r="2"/>
        <circle cx="40" cy="50" r="2"/>
        <circle cx="100" cy="40" r="2"/>
        <circle cx="130" cy="80" r="2"/>
        <circle cx="160" cy="60" r="2"/>
        <circle cx="170" cy="120" r="2"/>
      </g>

      <!-- Component symbols -->
      <g stroke="#1A6BFF" stroke-width="1" opacity="0.08" fill="none">
        <!-- Chip -->
        <rect x="145" y="145" width="20" height="12" rx="2"/>
        <path d="M145 148 H140 M145 154 H140 M165 148 H170 M165 154 H170"/>

        <!-- Capacitor -->
        <path d="M25 120 V130"/>
        <path d="M30 120 V130"/>
        <path d="M20 125 H25"/>
        <path d="M30 125 H35"/>

        <!-- Resistor -->
        <path d="M110 20 l4 -4 l4 8 l4 -8 l4 8 l4 -4"/>
      </g>
    </pattern>
  </defs>

  <rect width="200" height="200" fill="url(#circuitPattern)"/>
</svg>